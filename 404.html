<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found | AMAZING ROY COUTURE</title>
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .error-hero {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(135deg, rgba(53, 5, 57, 0.04) 0%, rgba(195, 182, 163, 0.18) 100%);
      padding: 4rem 1.5rem;
    }
    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(4rem, 12vw, 8rem);
      color: var(--color-primary);
      line-height: 1;
      margin-bottom: 1rem;
      letter-spacing: -0.03em;
    }
    .error-hero h1 {
      font-size: clamp(1.4rem, 3vw, 2rem);
      margin-bottom: 1rem;
    }
    .error-hero p {
      max-width: 480px;
      margin: 0 auto 2rem;
      color: var(--color-text-muted);
      line-height: 1.7;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-outline {
      display: inline-flex;
      align-items: center;
      padding: 0.9rem 2rem;
      border: 1.5px solid var(--color-primary);
      border-radius: var(--border-radius-sm);
      color: var(--color-primary);
      font-weight: 600;
      transition: var(--transition);
    }
    .btn-outline:hover {
      background-color: var(--color-primary);
      color: var(--color-secondary);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html">
        <img src="assets/logo.jpeg" alt="AMAZING ROY Logo" class="brand-logo">
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">Our Story</a></li>
          <li><a href="services.html">Custom Couture</a></li>
          <li><a href="contact.html">Contact &amp; Studio</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="error-hero">
    <div class="container">
      <div class="error-code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you're looking for doesn't exist or has been moved. Let's get you back to something beautiful.</p>
      <div class="error-actions">
        <a href="index.html" class="btn-primary">Return Home</a>
        <a href="services.html" class="btn-outline">Explore Couture</a>
      </div>
    </div>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
